name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Créer debug.keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Vérifier debug.keystore
        run: |
          pwd
          ls -lh "$GITHUB_WORKSPACE/debug.keystore"
          test -f "$GITHUB_WORKSPACE/debug.keystore"

      - name: Compiler l'APK
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Vérifier l'APK
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: boutique-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error