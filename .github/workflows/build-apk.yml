name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Créer debug.keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Donner les permissions à Gradle
        run: chmod +x gradlew

      - name: Compiler l'APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Vérifier l'APK
        run: |
          echo "=== APK générés ==="
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: boutique-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
